
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    <link rel="stylesheet" href="events.css">
</head>
<body>

    <div id="background-container"></div>

    <div class="video-bg">
        <video autoplay muted loop playsinline>
            <source src="assets/bg.mp4" type="video/mp4">
        </video>
    </div>

    <header class="navbar">
        <div class="logo-section">
            <img src="assets/club-logo.png" alt="Club Logo" class="logo">
            <div class="vertical-line"></div>
            <img src="assets/uni-logo.png" alt="University Logo" class="logo">
        </div>

        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <nav class="nav-links">
            <button class="nav-item" id="homeBtn"  onclick="location.href='index.html'">Home</button>
            <button class="nav-item" id="eventsBtn"  onclick="location.href='events.html'">Events</button>
            <button class="nav-item" id="teamBtn"  onclick="location.href='team.html'">Team</button>
            <button class="nav-item" id="legacyBtn"  onclick="location.href='legacy.html'">Legacy</button>
            <button class="nav-item" id="resourcesBtn"  onclick="location.href='resources.html'">Resources</button>
            <button class="nav-item" id="contactBtn"  onclick="location.href='contact.html'">Contact</button>
        </nav>
    </header>

    <main class="container">
        <h1 class="section-title">Upcoming Events</h1>
        
        <div class="event-card" id="eventCard">
            <div class="event-details">
                <h2 class="event-name">ROBO-TORQUE</h2>
                <div class="info-group">
                    <p><strong>Time:</strong> <span id="eventTime">10:00 AM</span></p>
                    <p><strong>Date:</strong> <span id="eventDate">October 25, 2024</span></p>
                    <p><strong>Venue:</strong> <span id="eventVenue">Main Auditorium, FoTE MSUB</span></p>
                </div>
                <div class="description">
                    <p><strong>Description:</strong> Join the ultimate battle of gears and circuits. Show off your bot's torque and speed!</p>
                </div>
                <a href="#" class="reg-link">Register Now →</a>
            </div>

            <div class="event-visual">
                <div class="cyber-frame">
                    <div class="inner-glow"></div>
                    <span class="glitch-text">LIVE</span>
                </div>
            </div>
        </div>
    
    
        <div class="spacer"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
